name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test RatesCore
        run: swift test --package-path RatesCore -Xswiftc -warnings-as-errors
      - name: Test HTTPClient
        run: swift test --package-path HTTPClient -Xswiftc -warnings-as-errors
      - name: Test Server
        run: swift test --package-path Server -Xswiftc -warnings-as-errors
      - name: Build the release server
        run: swift build --package-path Server -c release

  end-to-end:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Live end-to-end against the real upstream
        run: swift test --package-path RatesAPIEndToEndTests
