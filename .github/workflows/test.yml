name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test RatesCore
        run: swift test --package-path RatesCore -Xswiftc -warnings-as-errors
      - name: Test HTTPClient
        run: swift test --package-path HTTPClient -Xswiftc -warnings-as-errors
      - name: Test Server
        run: swift test --package-path Server -Xswiftc -warnings-as-errors
